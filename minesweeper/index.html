<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
  </head>
  <body class="minesweeper">
    <header>
      <header><h1>Minesweeper</h1></header>
      <p><a href="../index.html">Atrás</a></p>
      <hr />
    </header>
    <main>
      <section id="minesweeper">
        <section class="settings">
          <h2>Tamaño de tablero</h2>
          <ul class="board-sizes">
            <li>9x9</li>
            <li>16x16</li>
            <li>16x30</li>
            <li>20x30</li>
          </ul>

          <h2>Cantidad de minas</h2>
          <ul class="mine-options mine-options-9x9">
            <li>10</li>
            <li>15</li>
            <li>20</li>
          </ul>

          <ul class="mine-options mine-options-16x16">
            <li>25</li>
            <li>50</li>
            <li>75</li>
          </ul>

          <ul class="mine-options mine-options-16x30">
            <li>50</li>
            <li>115</li>
            <li>180</li>
          </ul>

          <ul class="mine-options mine-options-20x30">
            <li>70</li>
            <li>175</li>
            <li>220</li>
          </ul>
          <button>Empezar</button>
        </section>
        <section class="game"></section>
      </section>
    </main>
    <script type="module" src="./ts/import-styles.ts"></script>
    <script type="module" src="./ts/game/game.ts"></script>
  </body>
</html>
